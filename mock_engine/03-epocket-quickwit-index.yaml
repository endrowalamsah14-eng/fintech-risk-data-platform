# =====================================================================
# QUICKWIT INDEX CONFIGURATION - TRANSACTIONS DELTA INDEX
# =====================================================================
version: 0.8
index_id: epocket-transactions
doc_mapping:
  mode: strict
  field_mappings:
    # Transaction Identity
    - name: id
      type: text
      tokenizer: raw

    # Account & Customer Relationships
    - name: acct_id
      type: text
      tokenizer: raw
    - name: customer_id
      type: text
      tokenizer: raw

    # Financial Data (Indexed for fast aggregations)
    - name: amount
      type: i64
      fast: true
    - name: status
      type: text
      tokenizer: raw
      fast: true

    # Fraud & Risk Data (Merged from Radar System)
    - name: risk_level
      type: text
      tokenizer: raw
    - name: risk_score
      type: i64
      fast: true

    # Timestamp for Time-Series Queries
    - name: created_at
      type: datetime
      input_formats:
        - rfc3339
      fast: true
      fast_precision: seconds

  # Primary timestamp for time-based routing and retention
  timestamp_field: created_at