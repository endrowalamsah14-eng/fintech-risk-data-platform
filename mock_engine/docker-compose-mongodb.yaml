version: '3.8'

services:
  mongo-node-1:
    image: mongo:7.0
    container_name: mongo-node-1
    command: ["--replSet", "epocket-rs", "--bind_ip_all"]
    ports:
      - "27017:27017"
    networks:
      - zona1-network

  mongo-node-2:
    image: mongo:7.0
    container_name: mongo-node-2
    command: ["--replSet", "epocket-rs", "--bind_ip_all"]
    ports:
      - "27018:27017"
    networks:
      - zona1-network

  mongo-node-3:
    image: mongo:7.0
    container_name: mongo-node-3
    command: ["--replSet", "epocket-rs", "--bind_ip_all"]
    ports:
      - "27019:27017"
    networks:
      - zona1-network

  mongo-init:
    image: mongo:7.0
    depends_on:
      - mongo-node-1
      - mongo-node-2
      - mongo-node-3
    networks:
      - zona1-network
    command: >
      mongosh --host mongo-node-1:27017 --eval 
      'rs.initiate({
        _id: "epocket-rs",
        members: [
          { _id: 0, host: "mongo-node-1:27017" },
          { _id: 1, host: "mongo-node-2:27017" },
          { _id: 2, host: "mongo-node-3:27017" }
        ]
      })'

networks:
  zona1-network:
    external: true