# ==========================================
# PROMETHEUS COST-OPS CONFIGURATION
# ==========================================
alertmanager:
  enabled: false 

pushgateway:
  enabled: false 

server:
  global:
    scrape_interval: 15s 
  
  persistentVolume:
    enabled: true
    size: 2Gi
    storageClass: "local-path"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true