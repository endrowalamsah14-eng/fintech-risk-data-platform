# =====================================================================
# BENTHOS VALUES - THE DATA CONTRACT & ROUTER (BLUEPRINT 2.0)
# =====================================================================
replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  input:
    kafka_franz:
      # 🔥 FIX: Ganti port ke 9093
      seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
      topics:
        - "epocket.transactions"
        - "epocket.audit_logs"
      consumer_group: "benthos-router-group"

  pipeline:
    processors:
      # 1. Validasi Skema (Data Contract)
      - mapping: |
          root._contract_error = if this.transaction_id == null {
            "missing_transaction_id"
          } else if this.user_id == null {
            "missing_user_id"
          } else {
            deleted()
          }
      
      # 2. Penyematan Metadata
      - mapping: |
          root = this
          root.contract_error = this._contract_error
          root.ingested_at = now()

  output:
    switch:
      cases:
        # JALUR KARANTINA: Data Cacat -> DLQ Redpanda
        - check: this._contract_error != null
          output:
            kafka_franz:
              # 🔥 FIX: Ganti port ke 9093
              seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
              topic: "dlq.epocket_errors"

        # JALUR HOT OPERATIONAL: Transactions -> Redis K8s
        - check: meta("kafka_topic") == "epocket.transactions"
          output:
            redis_hash:
              url: "redis://redis-master.uds-production.svc.cluster.local:6379"
              key: 'trx:${! json("transaction_id") }'
              walk_metadata: false
              walk_json_object: true

        # JALUR ENTERPRISE LAKEHOUSE: Audit Logs -> AWS S3 (Iceberg Ready)
        - check: meta("kafka_topic") == "epocket.audit_logs"
          output:
            aws_s3:
              bucket: "uds-enterprise-datalake-2026"
              region: "eu-north-1"
              # 🔥 FIX: Gunakan format interpolasi waktu Bloblang yang valid agar linter tidak meledak
              path: 'audit_logs/date=${! now().ts_format("2006-01-02") }/${! uuid_v4() }.json'
              max_in_flight: 64
              batching:
                count: 500
                period: "5s"