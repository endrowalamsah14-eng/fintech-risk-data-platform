# =====================================================================
# BENTHOS VALUES - THE DATA CONTRACT & ROUTER (FINOPS FINAL)
# =====================================================================
replicaCount: 2 # Scale up for high throughput
autoscaling:
  enabled: true # HPA Bawaan Helm chart
  minReplicas: 2
  maxReplicas: 5

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  input:
    kafka_franz:
      seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
      topics:
        # 🔥 FOSIL EPOCKET DIBANTAI: Diganti jadi standar eMarket & Logistik
        - "emarket.orders"
        - "emarket.shipments"
      consumer_group: "benthos-router-group"

  pipeline:
    processors:
      - mapping: |
          root._contract_error = if this.transaction_id == null {
            "missing_transaction_id"
          } else if this.user_id == null {
            "missing_user_id"
          } else {
            deleted()
          }
      - mapping: |
          root = this
          root.contract_error = this._contract_error
          root.ingested_at = now()

  output:
    switch:
      cases:
        - check: this._contract_error != null
          output:
            kafka_franz:
              seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
              # 🔥 DLQ EPOCKET DIBANTAI
              topic: "dlq.emarket_errors"

        - check: this._contract_error == null
          output:
            gcp_cloud_storage:
              bucket: "uds-bronze-zone-cdc-archive"
              path: 'raw_zone/date=${! now().ts_format("2006-01-02") }/${! uuid_v4() }.json'
              max_in_flight: 64
              batching:
                count: 500
                period: "5s"