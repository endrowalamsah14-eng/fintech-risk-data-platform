# =====================================================================
# BENTHOS VALUES - THE DATA CONTRACT & ROUTER (BLUEPRINT FINAL)
# =====================================================================
replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  input:
    kafka_franz:
      seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
      topics:
        - "epocket.transactions"
        - "epocket.audit_logs"
      consumer_group: "benthos-router-group"

  pipeline:
    processors:
      # 1. Validasi Skema (Data Contract)
      - mapping: |
          root._contract_error = if this.transaction_id == null {
            "missing_transaction_id"
          } else if this.user_id == null {
            "missing_user_id"
          } else {
            deleted()
          }
      
      # 2. Penyematan Metadata
      - mapping: |
          root = this
          root.contract_error = this._contract_error
          root.ingested_at = now()

  output:
    switch:
      cases:
        # JALUR KARANTINA: Data Cacat -> DLQ Redpanda
        - check: this._contract_error != null
          output:
            kafka_franz:
              seed_brokers: ["redpanda-0.redpanda.uds-production.svc.cluster.local:9093"]
              topic: "dlq.epocket_errors"

        # JALUR ENTERPRISE LAKEHOUSE: Semua Data Valid -> AWS S3 (Iceberg Ready)
        - check: this._contract_error == null
          output:
            aws_s3:
              bucket: "uds-enterprise-datalake-2026"
              region: "eu-north-1"
              path: 'raw_zone/date=${! now().ts_format("2006-01-02") }/${! uuid_v4() }.json'
              max_in_flight: 64
              batching:
                count: 500
                period: "5s"