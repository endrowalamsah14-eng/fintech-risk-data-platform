# =====================================================================
# STARROCKS VALUES - LAKEHOUSE COMPUTE (AWS EKS SPOT OPTIMIZED)
# =====================================================================
starrocks:
  starrocksFESpec:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
    storageSpec:
      name: fe-meta
      storageClassName: "gp2"
      storageSize: 10Gi

  starrocksBeSpec:
    replicas: 2 # Scale up compute worker
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    storageSpec:
      name: be-storage
      storageClassName: "gp2"
      storageSize: 50Gi