# =====================================================================
# STARROCKS VALUES - LAKEHOUSE COMPUTE (HETZNER VPS OPTIMIZED)
# =====================================================================
starrocks:
  starrocksFESpec:
    # Frontend Node: Manages metadata & query parsing
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

  starrocksBeSpec:
    # Backend Node: Executes queries against AWS S3 (Iceberg)
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi