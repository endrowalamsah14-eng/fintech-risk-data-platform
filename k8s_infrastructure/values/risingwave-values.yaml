# =====================================================================
# RISINGWAVE VALUES - REAL-TIME STREAMING DB (AWS EKS OPTIMIZED)
# =====================================================================
tags:
  etcd: true
  minio: true 
  postgresql: true

etcd:
  persistence:
    enabled: true
    storageClass: "gp2"

minio:
  persistence:
    enabled: true
    storageClass: "gp2"
    size: 20Gi

postgresql:
  primary:
    persistence:
      enabled: true
      storageClass: "gp2"

metaNode:
  replicaCount: 1
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 500m, memory: 1Gi } }

computeNode:
  replicaCount: 2 # Real-time muscle
  resources: { requests: { cpu: 1, memory: 2Gi }, limits: { cpu: 2, memory: 4Gi } }

frontendNode:
  replicaCount: 1
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 500m, memory: 1Gi } }
compactorNode:
  replicaCount: 1
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 500m, memory: 1Gi } }