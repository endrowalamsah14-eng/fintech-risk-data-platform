# =====================================================================
# CLEARML MLOPS VALUES (LIGHTWEIGHT TUNE)
# =====================================================================
apiserver:
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

fileserver:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

# Arahkan artefak ClearML ke S3 Bucket lu
# Agar Seldon Core bisa narik artefak secara native dari S3
storage:
  type: s3
  s3:
    bucket: "uds-enterprise-datalake-2026"
    path: "clearml-artifacts"