# =====================================================================
# REDPANDA VALUES - THE MESSAGE BUS (HETZNER VPS OPTIMIZED)
# =====================================================================
statefulset:
  replicas: 1

config:
  cluster:
    auto_create_topics_enabled: false

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2.5Gi

storage:
  persistentVolume:
    enabled: true
    storageClass: "local-path"

# =====================================================================
# ⚙️ BIG RED BUTTON MAGIC: AUTOMATED TOPIC PROVISIONING
# =====================================================================
post_install_job:
  enabled: false # 🔥 MATIKAN! KITA PAKAI JALUR KASAR DI CI/CD

tls:
  enabled: false