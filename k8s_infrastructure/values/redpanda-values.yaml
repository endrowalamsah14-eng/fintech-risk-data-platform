# =====================================================================
# REDPANDA VALUES - THE MESSAGE BUS (HETZNER VPS OPTIMIZED)
# =====================================================================
statefulset:
  replicas: 1

config:
  cluster:
    auto_create_topics_enabled: false
    default_topic_replications: 1

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2.5Gi

storage:
  persistentVolume:
    enabled: true
    storageClass: "local-path"

# =====================================================================
# ⚙️ AUTOMATED TOPIC PROVISIONING
# =====================================================================
post_install_job:
  enabled: false

tls:
  enabled: false