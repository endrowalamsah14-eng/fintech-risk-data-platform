# =====================================================================
# REDIS VALUES - HOT OPERATIONAL STORE (HETZNER VPS OPTIMIZED)
# =====================================================================
image:
  registry: docker.io
  repository: bitnami/redis
  tag: "latest"
  pullPolicy: IfNotPresent
    
architecture: standalone

auth:
  enabled: true
  password: "redis-dev-password"

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi