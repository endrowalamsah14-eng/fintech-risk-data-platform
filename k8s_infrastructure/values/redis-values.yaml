# =====================================================================
# REDIS VALUES - HOT OPERATIONAL STORE (AWS EKS OPTIMIZED)
# =====================================================================
image:
  registry: docker.io
  repository: bitnami/redis
  tag: "latest"
  pullPolicy: IfNotPresent
    
architecture: standalone

auth:
  enabled: true
  password: "redis-dev-password"

master:
  persistence:
    enabled: true
    storageClass: "gp2"
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi