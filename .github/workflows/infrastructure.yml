name: Terraform & K8s Validation

on:
  push:
    branches:
      - main

# Memanggil kredensial AWS & Hetzner dari GitHub Secrets secara global
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "eu-north-1"
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }} # 🔥 Injeksi kunci SSH dari Secrets

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        # Memastikan eksekusi berjalan di folder yang tepat
        working-directory: ./k8s_infrastructure/_cluster_configs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0 # Sesuaikan jika pakai versi spesifik
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

      # Apply hanya akan berjalan otomatis jika di-push ke branch main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color