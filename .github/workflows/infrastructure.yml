name: Terraform & K8s Validation

on:
  push:
    branches:
      - main
    # 🔥 BLOK ISOLASI: Abaikan perubahan di area Simulator & Dokumentasi
    paths-ignore:
      - 'mock_engine/**'
      - '**.md'
  pull_request:
    branches:
      - main
    # 🔥 BLOK ISOLASI: Abaikan perubahan di area Simulator & Dokumentasi
    paths-ignore:
      - 'mock_engine/**'
      - '**.md'

# Memanggil kredensial AWS & Hetzner dari GitHub Secrets secara global
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "eu-north-1"
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  KUBECONFIG: /home/runner/.kube/config # 🔥 Kunci elegan pengganti hardcode config_path
  
jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        # Memastikan eksekusi berjalan di folder yang tepat
        working-directory: ./k8s_infrastructure/_cluster_configs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0 # Sesuaikan jika pakai versi spesifik
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      # Apply hanya akan berjalan otomatis jika di-push ke branch main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color tfplan

# 1. Pastikan Namespace dan Helm Redpanda ter-deploy duluan
      - name: Deploy Redpanda (Terminal Bus) via Helm
        run: |
          helm repo add redpanda https://charts.redpanda.com
          helm repo update
          # Trik biar kaga error kalau namespace udah ada
          kubectl create namespace redpanda --dry-run=client -o yaml | kubectl apply -f -
          # Pakai 'upgrade --install' biar aman ditimpa berkali-kali sama CI/CD
          helm upgrade --install redpanda-cluster redpanda/redpanda \
            --namespace redpanda \
            --set statefulset.replicas=1 \
            --set console.enabled=true \
            --set external.enabled=false

      # 2. Baru deploy manifest pendukung (kayak Debezium)
      - name: Deploy K8s Manifests (Zona 2)
        run: |
          kubectl apply -f k8s_infrastructure/manifests/        