name: Terraform & K8s Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mock_engine/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'mock_engine/**'
      - '**.md'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "eu-north-1"
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  KUBECONFIG: /home/runner/.kube/config
  
jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./k8s_infrastructure/_cluster_configs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color tfplan

      - name: Deploy Redpanda (Terminal Bus) via Helm
        run: |
          helm repo add redpanda https://charts.redpanda.com
          helm repo update
          kubectl create namespace redpanda --dry-run=client -o yaml | kubectl apply -f -
          
          helm upgrade --install redpanda-cluster redpanda/redpanda \
            --namespace redpanda \
            -f ${GITHUB_WORKSPACE}/k8s_infrastructure/values/redpanda-values.yaml \
            --set statefulset.replicas=1 \
            --set console.enabled=true \
            --set external.enabled=false

      - name: Setup Kafka Topics (Jalur Bersih GitOps)
        run: |
          echo "Menunggu broker Redpanda siap 100%..."
          kubectl rollout status statefulset/redpanda-cluster -n redpanda --timeout=180s
          
          echo "Memberi jeda 15 detik agar TCP Port 9093 benar-benar listen..."
          sleep 15
          
          echo "Menciptakan topik Ledger & Audit (Partisi 3, Replika 1)..."
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create epocket.transactions -p 3 -r 1 || true
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create epocket.audit_logs -p 3 -r 1 || true
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create dlq.epocket_errors -p 1 -r 1 || true
          
          echo "Menciptakan topik internal Debezium (COMPACTED)..."
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create debezium-configs -p 1 -r 1 -c cleanup.policy=compact || true
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create debezium-offsets -p 1 -r 1 -c cleanup.policy=compact || true
          kubectl exec -n redpanda redpanda-cluster-0 -c redpanda -- rpk topic create debezium-status -p 1 -r 1 -c cleanup.policy=compact || true

      - name: Deploy K8s Manifests (Zona 2)
        run: |
          kubectl apply -f ${GITHUB_WORKSPACE}/k8s_infrastructure/manifests/

      - name: Deploy Debezium CDC Connectors (Bulletproof)
        run: |
          echo "Menunggu K8s pod Debezium jalan..."
          kubectl rollout status deployment/debezium-connect -n redpanda --timeout=180s
          
          echo "Menunggu Java Engine buka port 8083..."
          for i in {1..60}; do
            pkill kubectl || true
            kubectl port-forward -n redpanda svc/debezium-connect-svc 8083:8083 &
            sleep 5
            if curl -s http://localhost:8083/connectors > /dev/null; then
              echo "✅ Pintu API Debezium terbuka!"
              break
            fi
          done
          
          echo "Menyuntikkan konfigurasi CDC..."
          for config_file in ${GITHUB_WORKSPACE}/k8s_infrastructure/cdc_config/*.json; do
            CONNECTOR_NAME=$(jq -r '.name' $config_file)
            curl -s -X DELETE http://localhost:8083/connectors/$CONNECTOR_NAME || true
            curl -s -X POST -H "Content-Type: application/json" --data @$config_file http://localhost:8083/connectors
            echo "✅ $CONNECTOR_NAME tersuntik!"
          done